<head>

<title>Deutsch Zauber ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1033;--bg2:#2a1263;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.16);--tx:#f4f1ff;--mut:#b9b4e6;--gold:#ffd66b;--der:#6cb8ff;--die:#ff8fc2;--das:#7be8b0;--verb:#c3a2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Vazirmatn,system-ui,Tahoma,sans-serif;color:var(--tx);background:
radial-gradient(2px 2px at 12% 18%,#fff8,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff9,transparent),radial-gradient(2px 2px at 55% 40%,#ffd66b99,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff7,transparent),radial-gradient(2px 2px at 88% 66%,#fff8,transparent),
radial-gradient(900px 500px at 85% -10%,#7c3aed66,transparent),radial-gradient(800px 500px at 0% 100%,#0ea5e955,transparent),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:14px}
header{text-align:center;padding:10px 0 4px}
h1{margin:0;font-size:30px;font-weight:800;background:linear-gradient(90deg,#ffd66b,#ff8fc2,#9ad0ff,#ffd66b);background-size:200% 100%;animation:sh 6s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px #0005}
.filters{display:flex;gap:8px;margin:12px 0}
select,input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
select option{color:#111}
input:focus,select:focus{border-color:var(--gold)}
.card{padding:26px 18px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;animation:sway 7s ease-in-out infinite;position:relative;cursor:pointer}
@keyframes float{50%{transform:translateY(-6px)}}
.cnt{position:absolute;top:12px;inset-inline-start:16px;color:var(--mut);font-size:12px}
.tag{font-size:12px;color:var(--mut);background:#fff1;border-radius:99px;padding:3px 10px}
.art{font-weight:800;font-size:22px;direction:ltr;display:inline-block}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}.vb{color:var(--verb)}
.de{font-size:40px;font-weight:800;direction:ltr;word-break:break-word;text-shadow:0 0 24px #ffd66b55}
.sub{color:var(--mut);direction:ltr;font-size:16px}
.fa{font-size:30px;color:var(--gold);font-weight:600;min-height:44px}
.hint{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;color:var(--tx);border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:11px 16px;font-size:14px;transition:.15s}
button:active{transform:scale(.95)}
.b-k{background:linear-gradient(135deg,#10b98199,#059669aa)}.b-r{background:linear-gradient(135deg,#f59e0b99,#d97706aa)}.b-h{background:linear-gradient(135deg,#f43f5e99,#be123caa)}
.gold{background:linear-gradient(135deg,#ffd66b,#ff9f5a);color:#2b1700;font-weight:800;border:none}
.speak{font-size:20px;padding:8px 14px;border-radius:99px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b1033ee 40%);z-index:5}
nav div{display:flex;gap:4px;padding:6px;max-width:460px;width:100%}
nav button{flex:1;border:none;background:transparent;color:var(--mut);padding:9px 4px;font-size:13px;border-radius:14px}
nav button.on{background:var(--glass);color:var(--gold);border:1px solid var(--line);font-weight:800}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;cursor:pointer}
.item b{direction:ltr;font-size:17px}
.item .f{margin-inline-start:auto;color:var(--gold);text-align:end}
.dot{width:9px;height:9px;border-radius:50%;background:#fff3;flex:none}
.dot.k{background:#10b981}.dot.r{background:#f59e0b}.dot.h{background:#f43f5e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{padding:16px 8px;text-align:center}.stat b{display:block;font-size:32px;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.bar{height:12px;border-radius:99px;background:#fff2;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7be8b0,#ffd66b);width:0;transition:width .6s}
.sheet{position:fixed;inset:0;background:#050820cc;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px;background:linear-gradient(170deg,#1b1450,#10143f);border:1px solid var(--line)}
.panel h2{margin:0;direction:ltr;text-align:center;font-size:30px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:8px 14px;font-size:13px}.tabs button.on{background:var(--gold);color:#2b1700;border:none;font-weight:800}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tc{padding:12px 14px;border-radius:18px;background:#ffffff0d;border:1px solid var(--line);direction:ltr;text-align:left}
.tc h4{margin:0 0 8px;color:var(--gold);font-size:14px}
.tc div{padding:3px 0;font-size:15px;border-bottom:1px dashed #ffffff14}.tc div:last-child{border:0}
.tc em{font-style:normal;color:var(--mut);display:inline-block;min-width:74px}
.x{float:inline-end;padding:6px 12px}
.err{padding:20px;text-align:center;color:#ffb4c0}
.empty{padding:30px;text-align:center;color:var(--mut)}

/* ---- v3 زیبایی ---- */
@keyframes sh{to{background-position:200% 0}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(120deg);opacity:0}}
@keyframes beat{50%{transform:scale(1.25)}}
.wrap{position:relative;z-index:1}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky::before,.sky::after{content:"";position:absolute;inset:0;animation:tw 3.2s ease-in-out infinite alternate;
background-image:radial-gradient(1.6px 1.6px at 8% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 8%,#ffd66b,transparent),radial-gradient(1.8px 1.8px at 41% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 63% 14%,#fff,transparent),radial-gradient(1.6px 1.6px at 90% 28%,#9ad0ff,transparent),radial-gradient(1.4px 1.4px at 15% 55%,#fff,transparent),radial-gradient(1.8px 1.8px at 72% 62%,#ffd66b,transparent),radial-gradient(1.2px 1.2px at 48% 80%,#fff,transparent),radial-gradient(1.6px 1.6px at 93% 88%,#fff,transparent),radial-gradient(1.4px 1.4px at 30% 92%,#ff8fc2,transparent)}
.sky::after{animation-delay:1.6s;transform:scaleX(-1);opacity:.7}
.flags{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 10px}
.flag{width:54px;height:32px;object-fit:cover;display:block;border-radius:9px;box-shadow:0 0 0 2px #ffffff40,0 6px 22px #0007,0 0 26px #ffd66b33;transition:.3s}
.flag:hover{transform:translateY(-3px) rotate(-3deg)}
.arrow{font-size:22px;color:var(--gold);text-shadow:0 0 14px #ffd66b;animation:beat 2.4s ease-in-out infinite}
header p{letter-spacing:.2px}
.card::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1.6px;background:linear-gradient(135deg,#ffd66b,#ff8fc2,#8b5cf6,#38bdf8);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.9}
.card{box-shadow:0 14px 50px #0007,0 0 60px #7c3aed40}
#fav{animation:pop .35s ease-out}
button:hover{filter:brightness(1.15)}
.item{transition:.2s}.item:hover{transform:translateX(-3px);border-color:var(--gold)}
.stat b{text-shadow:0 0 18px #ffd66b66}
.pf{position:fixed;z-index:20;font-size:22px;pointer-events:none;animation:pf .95s ease-out forwards}
footer{text-align:center;margin:26px 0 6px;color:var(--mut);font-size:13px}
footer b{color:var(--gold);font-weight:800}
footer small{display:block;margin-top:3px;opacity:.6;font-size:11px}
.heart{display:inline-block;animation:beat 1.6s ease-in-out infinite}
.reveal{font-size:17px;padding:13px 28px;border-radius:99px;margin-top:4px;box-shadow:0 0 0 0 #ffd66b88;animation:glow 2s infinite}
@keyframes glow{70%{box-shadow:0 0 0 14px #ffd66b00}100%{box-shadow:0 0 0 0 #ffd66b00}}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;margin-inline-end:10px;vertical-align:middle;box-shadow:0 0 0 2px #ffffff88,0 4px 18px #0008}
.item .sw{width:20px;height:20px;margin:0;flex:none}
.qo{display:grid;gap:10px;margin-top:12px}.qo button{padding:15px;font-size:17px}
.qo .ok{background:linear-gradient(135deg,#10b981cc,#059669cc);border-color:#7be8b0}
.qo .bad{background:linear-gradient(135deg,#f43f5ecc,#be123ccc)}
nav button{font-size:12px}.ex{padding:0;overflow:hidden}.ex summary{padding:14px;cursor:pointer;font-weight:600;list-style:none}.ex summary small{color:var(--mut);margin-inline-start:6px}.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px dashed #ffffff22}.ph div{flex:1}.ph b{display:block;direction:ltr;text-align:left;font-size:16px}.ph span{color:var(--gold);font-size:14px}
.gr{padding:2px 16px 14px}.gr ul{margin:4px 0;padding-inline-start:18px}.gr li{margin:6px 0;line-height:1.9;font-size:14px}.gx{direction:ltr;text-align:left;background:#ffffff0d;border-radius:12px;padding:8px 12px;margin-top:8px}.gx div{padding:2px 0;font-size:15px}.lv{background:var(--gold);color:#2b1700;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}.vg figure{margin:0;text-align:center}.vg svg{width:100%;max-width:130px}.vg figcaption{font-size:13px;direction:ltr}.vg small{display:block;color:var(--mut)}
.cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:10px 0}.cl{text-align:center;direction:ltr}.cl svg{width:100%;max-width:110px}.cl b{display:block;font-size:13px}.cl small{color:var(--mut)}.vis{padding:0 14px 14px}
#card{touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
/* ---- کارت استوانه‌ای ---- */
.stage{position:relative;perspective:900px;margin:0 22px}
.stage .card{border-radius:36px/52px;transform-origin:50% 50%;backface-visibility:hidden}
.card::before{border-radius:inherit}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(5,8,32,.62),rgba(5,8,32,0) 20%,rgba(5,8,32,0) 80%,rgba(5,8,32,.62)),radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.14),transparent 60%),linear-gradient(0deg,rgba(5,8,32,.28),transparent 35%)}
@keyframes sway{0%,100%{transform:rotateY(-11deg) rotateX(3deg)}50%{transform:rotateY(11deg) rotateX(3deg) translateY(-6px)}}
.ar{position:absolute;top:50%;width:22px;text-align:center;font-size:30px;line-height:1;color:var(--gold);text-shadow:0 0 14px #ffd66b;pointer-events:none;z-index:3}
.ar.l{left:-22px;animation:blinkL 1.4s ease-in-out infinite}.ar.r{right:-22px;animation:blinkR 1.4s ease-in-out infinite;animation-delay:.7s}
@keyframes blinkL{0%,100%{opacity:.12;transform:translate(0,-50%)}50%{opacity:1;transform:translate(-5px,-50%)}}
@keyframes blinkR{0%,100%{opacity:.12;transform:translate(0,-50%)}50%{opacity:1;transform:translate(5px,-50%)}}
.swd .ar{display:none}
/* ===== v20: چرخش کارت + دسته‌کارت + دکمه‌های آبنباتی ===== */
.stage{margin-top:40px}
.cf{position:relative;width:100%;min-height:250px;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.3,1)}
.cf.flip{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fc.back{transform:rotateY(180deg)}
.fa.big{font-size:38px;line-height:1.5}
.ghost{position:absolute;inset:0;border-radius:36px/52px;background:rgba(255,255,255,.07);border:1px solid var(--line);pointer-events:none}
.ghost.g1{transform:translateY(-15px) scale(.94);opacity:.9}.ghost.g2{transform:translateY(-28px) scale(.87);opacity:.55}
.ghost span{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);direction:ltr}
button{border:none;border-radius:999px;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 0 #0003;padding:12px 20px;position:relative;top:0;background:linear-gradient(180deg,#ff9ad5,#ff5fa8);box-shadow:0 6px 0 #c23a82,0 10px 16px #0006,inset 0 2px 0 #ffffff66;transition:top .1s,box-shadow .1s,filter .15s}
button:active{top:5px;transform:none;box-shadow:0 1px 0 #c23a82,0 3px 6px #0006,inset 0 2px 0 #ffffff55}
.b-k{background:linear-gradient(180deg,#9af5c2,#2fd486);box-shadow:0 6px 0 #17935a,0 10px 16px #0006,inset 0 2px 0 #ffffff77}
.b-r{background:linear-gradient(180deg,#ffd98a,#ff9f43);box-shadow:0 6px 0 #c2701f,0 10px 16px #0006,inset 0 2px 0 #ffffff77}
.b-h{background:linear-gradient(180deg,#ff9aa8,#ff4d6d);box-shadow:0 6px 0 #b82a45,0 10px 16px #0006,inset 0 2px 0 #ffffff66}
.gold{color:#4a2a00;text-shadow:0 1px 0 #fff6;background:linear-gradient(180deg,#fff0a8,#ffc13b);box-shadow:0 6px 0 #b97b12,0 10px 16px #0006,inset 0 2px 0 #ffffffaa}
.speak{background:linear-gradient(180deg,#a8e0ff,#4aa8ff);box-shadow:0 5px 0 #2b72b8,0 8px 14px #0006,inset 0 2px 0 #ffffff88;border-radius:50%;width:46px;height:46px;padding:0;font-size:20px}
.tabs button{box-shadow:0 4px 0 #c23a82,0 6px 10px #0005,inset 0 2px 0 #ffffff55;padding:9px 16px}
.tabs button.on{color:#4a2a00;background:linear-gradient(180deg,#fff0a8,#ffc13b);box-shadow:0 4px 0 #b97b12,0 6px 10px #0005,inset 0 2px 0 #ffffffaa}
.qo button{background:linear-gradient(180deg,#c9b6ff,#8b6cf0);box-shadow:0 5px 0 #5a3fc0,0 8px 14px #0006,inset 0 2px 0 #ffffff77;font-size:17px;text-align:center}
.x{background:linear-gradient(180deg,#ff9aa8,#ff4d6d);box-shadow:0 4px 0 #b82a45,0 6px 10px #0005,inset 0 2px 0 #ffffff66;border-radius:50%;width:40px;height:40px;padding:0}
select,input{border-radius:20px;border:2px solid rgba(255,255,255,.25);padding:12px 14px;font-weight:600;box-shadow:inset 0 2px 6px #0004;background-color:rgba(255,255,255,.1)}
nav{padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
nav div{max-width:560px;gap:4px;padding:8px;border-radius:30px;box-shadow:0 -4px 24px #0008}
nav button,nav button:active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:6px 2px;border-radius:22px;font-size:12px;font-weight:700;color:var(--mut);text-shadow:none;background:transparent;box-shadow:none;border:none;top:0}
nav button i{font-style:normal;font-size:27px;line-height:1;transition:transform .2s}
nav button.on{color:#4a2a00;background:linear-gradient(180deg,#fff0a8,#ffc13b);box-shadow:0 6px 0 #b97b12,0 10px 16px #0007,inset 0 2px 0 #ffffffaa;transform:translateY(-8px)}
nav button.on i{transform:scale(1.18)}
body{padding-bottom:calc(124px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
<header><div class="flags"><img class="flag" src="flag-ir.png" alt="ایران" width="54" height="32"><span class="arrow">⇄</span><svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none" role="img" aria-label="Deutschland"><rect width="30" height="6.7" fill="#111"/><rect y="6.67" width="30" height="6.7" fill="#dd0000"/><rect y="13.33" width="30" height="6.7" fill="#ffce00"/></svg></div><h1>✨ Deutsch Zauber</h1><p>جادوی آلمانی · هر روز یک قدم جلوتر</p></header>

<section id="t-cards">
 <div class="filters"><select id="fm"><option value="">📚 همه‌ی کارت‌ها</option><option value="smart">🧠 مرور هوشمند</option></select><select id="fl"><option value="">همه‌ی سطح‌ها</option><option>A1</option><option>A2</option><option>B1</option><option value="A1-A2">A1 تا A2</option></select></div>
 <div class="filters" style="margin-top:0"><select id="fc"></select><select id="fa"></select></div>
 <div class="stage"><div class="ghost g2"></div><div class="ghost g1"><span id="g1t"></span></div><span class="ar l">❮</span><div class="glass card" id="card" title="برای دیدن معنی بزن"></div><span class="ar r">❯</span></div>
 <div class="row">
  <button class="b-h" onclick="mark('h')">💪 سخته</button>
  <button class="b-r" onclick="mark('r')">🔁 مرور</button>
  <button class="b-k" onclick="mark('k')">✅ بلدم</button>
 </div>
 <div class="row">
  <button class="gold" onclick="shuf()">🔀 مخلوط</button>
 </div>
</section>

<section id="t-dict" hidden>
 <div class="filters" style="margin-top:14px"><input id="q" placeholder="🔍 جستجو (آلمانی یا فارسی)"><select id="dc"></select><select id="dl"><option value="">همه‌ی سطح‌ها</option><option>A1</option><option>A2</option><option>B1</option><option value="A1-A2">A1 تا A2</option></select></div>
 <div class="hint" id="dn" style="margin:0 4px 6px"></div>
 <div class="list" id="list"></div>
</section>

<section id="t-prog" hidden>
 <div class="stats">
  <div class="glass stat"><b id="sT">0</b><span>کل واژه‌ها</span></div>
  <div class="glass stat"><b id="sK">0</b><span>بلدم</span></div>
  <div class="glass stat"><b id="sR">0</b><span>برای مرور</span></div>
 </div>
 <div class="glass" style="padding:16px"><div class="hint">پیشرفت کلی</div><div class="bar"><i id="pb"></i></div><div class="hint" id="pt"></div></div>
 <div class="hint" id="due" style="text-align:center;margin:12px"></div>
 <div class="row"><button class="b-h" onclick="resetP()">🗑 پاک‌کردن پیشرفت</button></div>
</section>
<section id="t-quiz" hidden>
 <div class="filters" style="margin-top:14px"><select id="qc"></select><select id="ql"><option value="">همه‌ی سطح‌ها</option><option>A1</option><option>A2</option><option>B1</option><option value="A1-A2">A1 تا A2</option></select><select id="qd"><option value="de">آلمانی ← فارسی</option><option value="fa">فارسی ← آلمانی</option></select></div>
 <div class="glass" id="qbox" style="padding:22px;text-align:center"><div class="fa" style="margin:6px 0">آماده‌ای؟ 🎯</div><div class="hint">۱۰ سؤال چهارگزینه‌ای؛ جواب‌هایت در «مرور هوشمند» ثبت می‌شود</div><div class="row"><button class="gold" onclick="qStart()">🎯 شروع آزمون</button></div></div>
</section>
<section id="t-exp" hidden><div class="list" id="exl" style="margin-top:14px"></div></section>
<section id="t-gram" hidden><div class="list" id="grl" style="margin-top:14px"></div></section>
<div class="err" id="err" hidden></div>
<footer>ساخته‌شده با <span class="heart">💜</span> توسط <b id="by">محمد جواد حبیبی</b><small>Deutsch Zauber · نسخه ۳</small></footer>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeV()"><div class="panel" id="panel"></div></div>

<nav><div class="glass">
 <button class="on" data-t="cards"><i>🃏</i><span>کارت</span></button>
 <button data-t="dict"><i>📚</i><span>لغت</span></button>
 <button data-t="quiz"><i>🎯</i><span>آزمون</span></button>
 <button data-t="exp"><i>💬</i><span>عبارت</span></button>
 <button data-t="gram"><i>📖</i><span>گرامر</span></button>
 <button data-t="prog"><i>📈</i><span>پیشرفت</span></button>
</div></nav>

<script>
const $=s=>document.querySelector(s);
let ALL=[],deck=[],idx=0,shown=false,P={};
try{P=JSON.parse(localStorage.getItem('dz2')||'{}')}catch(e){}
let L={};try{L=JSON.parse(localStorage.getItem('dz3')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('dz2',JSON.stringify(P));localStorage.setItem('dz3',JSON.stringify(L))}catch(e){}};
const key=w=>w.word+'|'+w.fa;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isV=w=>w.type==='verb';
const KS=w=>w.kasus?' · '+({Akk:'آکوزاتیوساز (+Akk)',Dat:'داتیوساز (+Dat)','Akk+Dat':'آکوزاتیو + داتیو'}[w.kasus]):'';
const LV=w=>w.level||'B1';
const lvOK=(v,w)=>!v||(v==='A1-A2'?['A1','A2'].includes(LV(w)):LV(w)===v);
const strip=s=>s.replace(/^(ich|du|er\/sie\/es|wir|ihr|sie|Sie) /,'');

Promise.all([fetch('words.json',{cache:'no-cache'}).then(r=>r.json()),fetch('verbs.json',{cache:'no-cache'}).then(r=>r.json())])
.then(([n,v])=>{n.forEach(x=>{x.type=x.type||'noun'});ALL=n.concat(v);init()})
.catch(()=>{const e=$('#err');e.hidden=false;e.textContent='فهرست واژه‌ها بارگذاری نشد. فایل‌های words.json و verbs.json باید کنار index.html باشند و سایت از طریق میزبان وب باز شود.'});

function init(){
 const cats=[...new Set(ALL.map(w=>w.category))];
 const opt=(l,a)=>`<option value="">${l}</option>`+a.map(c=>`<option>${esc(c)}</option>`).join('');
 $('#fc').innerHTML=opt('همه دسته‌ها',cats);
 $('#dc').innerHTML=opt('همه دسته‌ها',cats);
 $('#qc').innerHTML=opt('همه دسته‌ها',cats);
 $('#fa').innerHTML='<option value="">همه</option><option>der</option><option>die</option><option>das</option><option value="verb">افعال</option>';
 $('#fc').onchange=$('#fa').onchange=$('#fm').onchange=$('#fl').onchange=()=>{mk();idx=0;card();smartLabel()};
 $('#q').oninput=$('#dc').onchange=$('#dl').onchange=dict;
 mk();card();dict();prog();smartLabel();
}
const DAY=864e5,IV=[0,1,3,7,14,30];
function sched(w,s){const k=key(w);let b=(L[k]||{b:0}).b;b=s==='k'?Math.min(b+1,5):s==='h'?0:Math.max(1,b-1);L[k]={b,t:Date.now()+(b?IV[b]*DAY:6e5)}}
function baseDeck(){const c=$('#fc').value,a=$('#fa').value;return ALL.filter(w=>(!c||w.category===c)&&(!a||(a==='verb'?isV(w):w.article===a))&&lvOK($('#fl').value,w))}
function smartDeck(b){const n=Date.now();return b.filter(w=>L[key(w)]&&L[key(w)].t<=n).sort((x,y)=>L[key(x)].b-L[key(y)].b).concat(b.filter(w=>!L[key(w)]).slice(0,15))}
function mk(){const b=baseDeck();deck=$('#fm').value==='smart'?smartDeck(b):b}
function smartLabel(){const o=$('#fm').options[1];if(o)o.textContent='🧠 مرور هوشمند ('+smartDeck(baseDeck()).length+')'}
function card(){
 const el=$('#card'),w=deck[idx];shown=false;$('#g1t').textContent='';
 if(!w){el.innerHTML=$('#fm').value==='smart'?'<div class="empty">🎉 مرورهای امروز تمام شد!<br>فردا دوباره بیا، یا حالت «همه‌ی کارت‌ها» را انتخاب کن.</div>':'<div class="empty">این فیلتر فعلاً واژه‌ای ندارد؛ دستهٔ دیگری را انتخاب کن.</div>';return}
 const st=P[key(w)]||'';
 let front,sub;
 if(isV(w)){
  front=`<span class="de vb">${esc(w.word)}</span>`;
  sub=`${esc(strip(w.indikativ.praesens.er_sie_es))} · ${esc(strip(w.indikativ.praeteritum.er_sie_es))} · ${esc(strip(w.indikativ.perfekt.er_sie_es))}`;
 }else{
  front=`<span class="de">${w.bg?`<i class="sw" style="background:${w.bg}"></i>`:''}${w.article?`<span class="art ${w.article}">${w.article}</span> `:''}${esc(w.word)}</span>`;
  sub=w.sub?esc(w.sub):w.article?(w.plural&&w.plural!=='-'?`Plural: die ${esc(w.plural)}`:'Plural: —'):'';
 }
 const nx=deck[(idx+1)%deck.length];$('#g1t').textContent=deck.length>1&&nx?lab(nx):'';
 const echo=(isV(w)||!w.article?'':w.article+' ')+w.word;
 el.innerHTML=`<div class="cf" id="cf"><div class="fc front"><span class="cnt">${idx+1} / ${deck.length}${st?' · '+({k:'✅',r:'🔁',h:'💪'}[st]):''}</span>
 <span class="tag">${esc(w.category)} · ${LV(w)}${isV(w)?KS(w):''}</span>${front}<div class="sub">${sub}</div>
 <button class="speak" onclick="event.stopPropagation();say()">🔊</button>
 ${isV(w)?'<button class="gold" style="padding:8px 14px" onclick="event.stopPropagation();openV(deck[idx])">📖 جدول صرف</button>':''}</div>
 <div class="fc back"><span class="tag">${esc(w.category)} · ${LV(w)}</span><div class="fa big">${esc(w.fa)}</div><div class="sub">${esc(echo)}</div>${!isV(w)&&w.sub?`<div class="sub" style="font-size:14px">${esc(w.sub)}</div>`:''}<button class="speak" onclick="event.stopPropagation();say()">🔊</button></div></div>`;
}
function flip(){const w=deck[idx],cf=$('#cf');if(!w||!cf)return;shown=!shown;cf.classList.toggle('flip',shown)}
$('#card').onclick=flip;
try{if(localStorage.getItem('dz4'))document.documentElement.classList.add('swd')}catch(_){}
(function(){
 const el=$('#card');let x0=0,y0=0,dx=0,t0=0,drag=false,moved=false,lock=null;
 const reset=()=>{el.style.transition='';el.style.transform='';el.style.opacity='';el.style.animation=''};
 el.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;drag=true;moved=false;lock=null;x0=e.clientX;y0=e.clientY;dx=0;t0=Date.now();el.style.transition='none';el.style.animation='none';try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-x0;const dy=e.clientY-y0;if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';if(lock!=='x')return;moved=true;el.style.transform=`translateX(${dx}px) rotateY(${dx/6}deg)`;el.style.opacity=String(1-Math.min(.55,Math.abs(dx)/450))});
 const end=()=>{
  if(!drag)return;drag=false;
  const fast=Math.abs(dx)/Math.max(1,Date.now()-t0)>.5;
  if(lock==='x'&&deck.length>1&&(Math.abs(dx)>70||(fast&&Math.abs(dx)>25))){
   const left=dx<0;try{localStorage.setItem('dz4','1')}catch(_){}document.documentElement.classList.add('swd');
   el.style.transition='transform .2s ease-in,opacity .2s';el.style.transform=`translateX(${left?'-115%':'115%'}) rotateY(${left?-50:50}deg)`;el.style.opacity='0';
   setTimeout(()=>{step(left?1:-1);el.style.transition='none';el.style.transform=`translateX(${left?'70%':'-70%'}) rotateY(${left?42:-42}deg)`;el.style.opacity='0';void el.offsetWidth;el.style.transition='transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s';el.style.transform='';el.style.opacity='1';setTimeout(reset,300)},200);
  }else{el.style.transition='transform .2s ease-out,opacity .2s';el.style.transform='';el.style.opacity='1';setTimeout(reset,220)}
 };
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false}},true);
 document.addEventListener('keydown',e=>{if($('#t-cards').hidden)return;if(e.key==='ArrowLeft')step(1);else if(e.key==='ArrowRight')step(-1)});
})();
function step(d){if(!deck.length)return;idx=(idx+d+deck.length)%deck.length;card()}
function shuf(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;card()}
function mark(s){const w=deck[idx];if(!w)return;P[key(w)]=s;sched(w,s);save();prog();dict();if(s==='k')burst();
 if($('#fm').value==='smart'){deck.splice(idx,1);if(s==='h')deck.splice(Math.min(idx+3,deck.length),0,w);if(idx>=deck.length)idx=0;card();smartLabel()}else step(1)}
function burst(){const r=$('#card').getBoundingClientRect(),E=['✨','⭐','💫','🌟','💜'];for(let i=0;i<16;i++){const e=document.createElement('span');e.className='pf';e.textContent=E[i%E.length];const a=Math.random()*6.28,d=60+Math.random()*110;e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`;document.body.append(e);setTimeout(()=>e.remove(),1000)}}
function say(){const w=deck[idx];if(!w||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance((isV(w)||!w.article?'':w.article+' ')+w.word);u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}

function dict(){
 if(!ALL.length)return;
 const q=$('#q').value.trim().toLowerCase(),c=$('#dc').value;
 const r=ALL.filter(w=>(!c||w.category===c)&&lvOK($('#dl').value,w)&&(!q||w.word.toLowerCase().includes(q)||w.fa.includes(q)||(w.plural||'').toLowerCase().includes(q)));
 $('#dn').textContent=r.length+' واژه';
 $('#list').innerHTML=r.slice(0,300).map(w=>{const i=ALL.indexOf(w);
  const b=isV(w)?'<span class="art vb" style="font-size:14px">فعل</span>':w.article?`<span class="art ${w.article}" style="font-size:16px">${w.article}</span>`:(w.bg?`<i class="sw" style="background:${w.bg}"></i>`:`<span class="art vb" style="font-size:14px">${esc(w.tag||'کلمه')}</span>`);
  return `<div class="glass item" onclick="pick(${i})"><i class="dot ${P[key(w)]||''}"></i>${b}<b>${esc(w.word)}</b><small class="lv">${LV(w)}</small><span class="f">${esc(w.fa)}</span></div>`}).join('')
  +(r.length>300?'<div class="empty">برای دیدن بقیه جستجو کن…</div>':'');
}
function pick(i){const w=ALL[i];if(isV(w))return openV(w);
 $('#fc').value='';$('#fa').value='';$('#fm').value='';$('#fl').value='';mk();idx=Math.max(0,deck.indexOf(w));go('cards');card()}

const TN={praesens:'Präsens',praeteritum:'Präteritum',perfekt:'Perfekt',plusquamperfekt:'Plusquamperfekt',futur1:'Futur I',futur2:'Futur II',konjunktiv1_praesens:'Konjunktiv I · Präsens',konjunktiv2_praeteritum:'Konjunktiv II · Präteritum'};
const tcard=(h,o,pers)=>`<div class="tc"><h4>${h}</h4>${Object.entries(o).map(([k,v])=>{let a=k,b=v;if(pers){const i=v.indexOf(' ');a=v.slice(0,i);b=v.slice(i+1)}return `<div><em>${esc(a)}</em>${esc(b)}</div>`}).join('')}</div>`;
let cur,grp='indikativ';
function openV(w){cur=w;grp='indikativ';viewV();$('#sheet').classList.add('on')}
function closeV(){$('#sheet').classList.remove('on')}
function viewV(){
 const w=cur,G=[['indikativ','Präsens · Präteritum']];
 if(w.imperativ)G.push(['imperativ','Imperativ']);
 G.push(['formen','Formen']);
 let body='';
 if(grp==='imperativ')body=`<div class="tg">${tcard('Imperativ',{du:w.imperativ.du,ihr:w.imperativ.ihr,Sie:w.imperativ.Sie})}</div>`;
 else if(grp==='formen')body=`<div class="tg">${tcard('Infinitiv & Partizip',{Infinitiv:w.infinitiv.praesens,'Infinitiv Perfekt':w.infinitiv.perfekt,'zu-Infinitiv':w.infinitiv.zu,'Partizip I':w.partizip.praesens,'Partizip II':w.partizip.perfekt,'Hilfsverb':w.aux})}</div>`;
 else body=`<div class="tg">${Object.entries(w[grp]).filter(([k])=>k==='praesens'||k==='praeteritum').map(([k,o])=>tcard(TN[k]||k,o,true)).join('')}</div>`;
 $('#panel').innerHTML=`<button class="x" onclick="closeV()">✕</button>
 <h2><span class="vb">${esc(w.word)}</span></h2>
 <div class="sub" style="text-align:center">${esc(w.fa)} · ${w.aux}${KS(w)}${w.separable?' · جداشدنی: '+esc(w.separable):''}</div>
 <div class="tabs">${G.map(([k,n])=>`<button class="${k===grp?'on':''}" onclick="grp='${k}';viewV()">${n}</button>`).join('')}</div>${body}`;
}

function prog(){
 const t=ALL.length,k=ALL.filter(w=>P[key(w)]==='k').length,r=ALL.filter(w=>P[key(w)]==='r'||P[key(w)]==='h').length;
 $('#sT').textContent=t;$('#sK').textContent=k;$('#sR').textContent=r;
 const p=t?Math.round(k/t*100):0;$('#pb').style.width=p+'%';const L=[[0,'🌱 تازه‌کار'],[25,'📘 دانش‌آموز'],[75,'🧭 کاشف'],[150,'🪄 جادوگر'],[300,'🐉 استاد'],[500,'👑 افسانه‌ای']];const lv=L.filter(x=>k>=x[0]).pop();$('#pt').textContent=p+'٪ از واژه‌ها را بلدی · سطح تو: '+lv[1];const nw=Date.now();$('#due').textContent='🧠 کارت‌های آمادهٔ مرور امروز: '+ALL.filter(w=>L[key(w)]&&L[key(w)].t<=nw).length;
}
function resetP(){if(confirm('همهٔ پیشرفتت پاک شود؟')){P={};L={};save();prog();dict();mk();idx=0;card();smartLabel()}}

const shuf2=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lab=w=>isV(w)||!w.article?w.word:w.article+' '+w.word;
let Q=null;
function qStart(){
 const c=$('#qc').value;let pool=ALL.filter(w=>(!c||w.category===c)&&lvOK($('#ql').value,w));if(pool.length<4)pool=ALL;
 Q={qs:shuf2(pool.slice()).slice(0,10),i:0,ok:0,d:$('#qd').value};qShow();
}
function qShow(){
 const b=$('#qbox');
 if(Q.i>=Q.qs.length){const r=Q.ok/Q.qs.length;b.innerHTML=`<div class="de" style="font-size:46px">${Q.ok} / ${Q.qs.length}</div><div class="fa" style="margin:10px 0">${r>=.9?'🏆 عالی بود!':r>=.6?'👏 آفرین!':'💪 باز هم تمرین کن!'}</div><div class="row"><button class="gold" onclick="qStart()">🔁 آزمون تازه</button><button onclick="go('cards')">🃏 فلش‌کارت</button></div>`;prog();smartLabel();return}
 const w=Q.qs[Q.i],de=Q.d==='de',f=x=>de?x.fa:lab(x),ans=f(w);
 const same=ALL.filter(x=>x!==w&&isV(x)===isV(w)&&f(x)!==ans),o3=[],seen=new Set([ans]);
 for(const x of shuf2(same.filter(x=>x.category===w.category)).concat(shuf2(same.filter(x=>x.category!==w.category)))){const l=f(x);if(!seen.has(l)){seen.add(l);o3.push(l)}if(o3.length===3)break}
 Q.w=w;Q.ans=ans;Q.done=false;Q.opts=shuf2([ans,...o3]);
 b.innerHTML=`<div class="hint">سؤال ${Q.i+1} از ${Q.qs.length} · ✅ ${Q.ok}</div><div class="${de?'de':'fa'}" style="margin:16px 0">${esc(de?lab(w):w.fa)}</div><div class="qo" style="direction:${de?'rtl':'ltr'}">${Q.opts.map((o,i)=>`<button onclick="qPick(${i})">${esc(o)}</button>`).join('')}</div><div id="qn" class="row"></div>`;
}
function qPick(i){
 if(Q.done)return;Q.done=true;const ok=Q.opts[i]===Q.ans;
 document.querySelectorAll('.qo button').forEach((x,j)=>{if(Q.opts[j]===Q.ans)x.classList.add('ok');else if(j===i)x.classList.add('bad')});
 if(ok){Q.ok++;sched(Q.w,'k')}else{sched(Q.w,'h');P[key(Q.w)]='h'}
 save();
 $('#qn').innerHTML=`<button class="gold" onclick="Q.i++;qShow()">${Q.i+1>=Q.qs.length?'🏁 نتیجه':'بعدی ←'}</button>`;
}

fetch('expressions.json',{cache:'no-cache'}).then(r=>r.json()).then(E=>{$('#exl').innerHTML=E.map(s=>`<details class="glass ex"><summary>${s.icon} ${esc(s.title)} <small>${s.items.length}</small></summary>${s.items.map(p=>`<div class="ph"><div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div><button class="speak" data-t="${esc(p[0])}" onclick="sayT(this)">🔊</button></div>`).join('')}</details>`).join('')}).catch(()=>{});
const VIS={
clock(){const C=[[3,0,'Es ist drei Uhr'],[3,15,'viertel nach drei'],[3,30,'halb vier'],[3,45,'viertel vor vier']];
 return '<div class="vg">'+C.map(([h,m,t])=>{const a=(h%12+m/60)*30-90,b=m*6-90,P=(d,l)=>(50+l*Math.cos(d*Math.PI/180))+','+(50+l*Math.sin(d*Math.PI/180));let k='';for(let i=0;i<12;i++){const c=Math.cos(i*Math.PI/6),n=Math.sin(i*Math.PI/6);k+=`<line x1="${50+40*c}" y1="${50+40*n}" x2="${50+45*c}" y2="${50+45*n}" stroke="#ffd66b" stroke-width="2"/>`}
 return `<figure><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#ffffff14" stroke="#ffffff55"/>${k}<polyline points="50,50 ${P(a,26)}" stroke="#7be8b0" stroke-width="4" stroke-linecap="round"/><polyline points="50,50 ${P(b,38)}" stroke="#ff8fc2" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#ffd66b"/></svg><figcaption>${t}<small>${h}:${String(m).padStart(2,'0')}</small></figcaption></figure>`}).join('')+'</div>'},
prep(){const R=(x,w=40,f='#8b5cf655')=>`<rect x="${x}" y="38" width="${w}" height="26" rx="4" fill="${f}" stroke="#c3a2ff"/>`,O=(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="#ffd66b"/>`;
 const S=[['auf · روی',R(30)+O(50,30)],['über · بالای',R(30)+O(50,12)],['unter · زیر',R(30)+O(50,78)],['vor · جلوی',R(30)+O(50,62)],['hinter · پشت',O(56,40)+R(30)],['neben · کنار',R(14,36)+O(80,51)],['an · چسبیده به',R(18,36)+O(62,51)],['in · داخل',R(30,40,'none')+O(50,51)],['zwischen · بین',R(6,28)+R(66,28)+O(50,51)]];
 return '<div class="vg">'+S.map(([t,g])=>`<figure><svg viewBox="0 0 100 90">${g}</svg><figcaption>${t}</figcaption></figure>`).join('')+'</div>'}};
fetch('grammar.json',{cache:'no-cache'}).then(r=>r.json()).then(G=>{$('#grl').innerHTML=G.map(g=>(g.n%3==1?`<div class="hint" style="margin:10px 4px 0">MODUL ${g.m}</div>`:'')+`<details class="glass ex"><summary>درس ${g.n} · ${esc(g.t)} <small class="lv">${g.lv}</small></summary><div class="gr"><ul>${g.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${g.vis?`<div class="vis" data-v="${g.vis}"></div>`:''}<div class="gx">${g.ex.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div></details>`).join('');document.querySelectorAll('.vis').forEach(e=>e.innerHTML=VIS[e.dataset.v]())}).catch(()=>{});
function sayT(b){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(b.dataset.t.replace(/…/g,''));u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function go(t){
 ['cards','dict','quiz','exp','gram','prog'].forEach(x=>$('#t-'+x).hidden=x!==t);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
